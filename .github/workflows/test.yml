name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/*.test.js'
      - name: Built page is up to date
        run: |
          python3 scripts/build_page.py
          git diff --exit-code dist/
